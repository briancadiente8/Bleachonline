name: Build Bleach Online Android (Native Ruffle)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native Ruffle Android
        uses: actions/checkout@v4
        with:
          repository: ruffle-rs/ruffle-android
          path: ruffle

      - name: Replace launcher with Ruffle Flash polyfill browser
        working-directory: ruffle
        run: |
          cat > app/src/main/java/rs/ruffle/MainActivity.kt <<'EOF'
          package rs.ruffle

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Window
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity

          class MainActivity : ComponentActivity() {
              private lateinit var web: WebView
              private val homeUrl = "https://bleach.gogames.me/"
              private var lastReportedUrl = ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.databaseEnabled = true
                  web.settings.allowFileAccess = true
                  web.settings.allowContentAccess = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  web.settings.userAgentString = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:84.0) Gecko/20100101 Firefox/84.0"

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun reportUrl(url: String) {
                          runOnUiThread {
                              if (url.isNotBlank() && url != lastReportedUrl) {
                                  lastReportedUrl = url
                                  android.widget.Toast.makeText(
                                      this@MainActivity,
                                      "Game request:\\n$url",
                                      android.widget.Toast.LENGTH_LONG
                                  ).show()
                              }
                          }
                      }
                  }, "BleachDebug")

                  web.webViewClient = object : WebViewClient() {
                      // Inject Ruffle's plugin polyfill into the MAIN HTML before GoGames' own
                      // Flash-detection JavaScript executes. evaluateJavascript() from
                      // onPageStarted/onPageFinished is too late for this legacy gate.
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: android.webkit.WebResourceRequest
                      ): android.webkit.WebResourceResponse? {
                          val url = request.url.toString()
                          if (request.isForMainFrame && url.startsWith("http") &&
                              (url.contains("bleach.gogames.me", ignoreCase = true) ||
                               url.contains("plaync100.net", ignoreCase = true))) {
                              try {
                                  val conn = java.net.URL(url).openConnection() as java.net.HttpURLConnection
                                  conn.instanceFollowRedirects = true
                                  conn.requestMethod = "GET"
                                  conn.setRequestProperty("User-Agent", web.settings.userAgentString)
                                  CookieManager.getInstance().getCookie(url)?.let { conn.setRequestProperty("Cookie", it) }
                                  conn.setRequestProperty("Accept-Encoding", "identity")
                                  request.requestHeaders["Referer"]?.let { conn.setRequestProperty("Referer", it) }
                                  conn.connectTimeout = 15000
                                  conn.readTimeout = 20000
                                  val code = conn.responseCode
                                  val contentType = conn.contentType ?: ""
                                  if (code in 200..399 && contentType.contains("text/html", ignoreCase = true)) {
                                      val html = conn.inputStream.bufferedReader(Charsets.UTF_8).readText()
                                      val early = """<script src="https://unpkg.com/@ruffle-rs/ruffle@latest"></script><script>(function(){try{var a=window.RufflePlayer&&window.RufflePlayer.newest&&window.RufflePlayer.newest();if(a&&a.pluginPolyfill)a.pluginPolyfill();}catch(e){}})();</script>"""
                                      val patched = if (html.contains("<head", ignoreCase = true)) {
                                          html.replaceFirst(Regex("<head[^>]*>", RegexOption.IGNORE_CASE)) { it.value + early }
                                      } else early + html
                                      val headers = mutableMapOf<String, String>()
                                      conn.headerFields.forEach { (k, v) ->
                                          if (k != null && !k.equals("Content-Encoding", true) && v != null && v.isNotEmpty()) {
                                              headers[k] = v.joinToString(",")
                                          }
                                      }
                                      return android.webkit.WebResourceResponse(
                                          "text/html", "UTF-8", code,
                                          conn.responseMessage ?: "OK", headers,
                                          java.io.ByteArrayInputStream(patched.toByteArray(Charsets.UTF_8))
                                      )
                                  }
                              } catch (e: Exception) {
                                  android.util.Log.e("BleachOnline", "HTML interception failed: $url", e)
                              }
                          }

                      override fun onPageStarted(view: WebView, url: String, favicon: android.graphics.Bitmap?) {
                          injectRuffle(true)
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          injectRuffle(false)
                      }

                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: android.webkit.WebResourceRequest
                      ): android.webkit.WebResourceResponse? {
                          val url = request.url.toString()
                          if (url.contains(".swf", ignoreCase = true) ||
                              url.contains("shockwave", ignoreCase = true) ||
                              url.contains("flash", ignoreCase = true)) {
                              runOnUiThread {
                                  if (url != lastReportedUrl) {
                                      lastReportedUrl = url
                                      android.widget.Toast.makeText(
                                          this@MainActivity,
                                          "Request:\\n$url",
                                          android.widget.Toast.LENGTH_LONG
                                      ).show()
                                  }
                              }
                          }
                          if (url.contains(".swf", ignoreCase = true) &&
                              (url.startsWith("http://") || url.startsWith("https://"))) {
                              runOnUiThread {
                                  if (!isFinishing) {
                                      val intent = Intent(this@MainActivity, PlayerActivity::class.java)
                                      intent.data = Uri.parse(url)
                                      startActivity(intent)
                                      web.stopLoading()
                                  }
                              }
                          }
                          return null
                      }
                  }

                  setContentView(web)
                  web.loadUrl(homeUrl)
              }

              private fun injectRuffle(early: Boolean = false) {
                  val js = """
                      (function() {
                        if (early && window.__bleachRuffleEarly) return;
                        if (!early && window.__bleachRuffleBridge) return;
                        if (early) window.__bleachRuffleEarly = true;
                        else window.__bleachRuffleBridge = true;
                        window.__bleachRuffleBridge = true;

                        // Plugin detection is handled by the parser-time Ruffle injection above.
                                                
                        window.RufflePlayer = window.RufflePlayer || {};
                        window.RufflePlayer.config = {
                          autoplay: "on",
                          unmuteOverlay: "hidden",
                          warnOnUnsupportedContent: false,
                          allowNetworking: "all",
                          upgradeToHttps: false,
                          compatibilityRules: true,
                          polyfills: true,
                          favorFlash: false
                        };

                        function startRuffle() {
                          try {
                            if (!(window.RufflePlayer && window.RufflePlayer.newest)) return;
                            var api = window.RufflePlayer.newest();
                            if (api.pluginPolyfill) api.pluginPolyfill();
                            if (api.polyfill) api.polyfill();

                            // Do not try to satisfy the site's Adobe Flash check. Native Ruffle will
                            // open the actual SWF when WebView requests it.
                            // Keep the page alive so login/session cookies are preserved.
                            if (window.__bleachDirectSwfStarted) return;
                            var candidates = [];
                            document.querySelectorAll("object,embed").forEach(function(el) {
                              var u = el.getAttribute("data") || el.getAttribute("src");
                              if (u && /\\.swf(?:[?#]|$)/i.test(u)) candidates.push(u);
                            });
                            var html = document.documentElement ? document.documentElement.innerHTML : "";
                            var re = /(?:https?:\\/\\/|\\/|\\b)[^"'\\s<>]+?\\.swf(?:\\?[^"'\\s<>]*)?/ig;
                            var m;
                            while ((m = re.exec(html)) !== null) candidates.push(m[0]);
                            candidates = candidates.map(function(u) {
                              try { return new URL(u, location.href).href; } catch(e) { return null; }
                            }).filter(Boolean);
                            candidates = candidates.filter(function(u,i,a){ return a.indexOf(u) === i; });

                            if (!candidates.length) return;
                            var swfUrl = candidates[0];
                            window.__bleachDirectSwfStarted = true;

                            var player = api.createPlayer();
                            player.style.width = "100%";
                            player.style.height = "100%";
                            player.style.position = "fixed";
                            player.style.left = "0";
                            player.style.top = "0";
                            player.style.zIndex = "2147483647";
                            document.body.innerHTML = "";
                            document.body.appendChild(player);

                            player.ruffle().load({
                              url: swfUrl,
                              allowScriptAccess: true,
                              autoplay: "on",
                              letterbox: "on",
                              unmuteOverlay: "hidden",
                              warnOnUnsupportedContent: false,
                              allowNetworking: "all",
                              compatibilityRules: true,
                              favorFlash: false,
                              base: new URL(".", swfUrl).href
                            });
                          } catch (e) {
                            console.log("Direct Ruffle load error", e);
                            window.__bleachDirectSwfStarted = false;
                          }
                        }

                        // Diagnostic: report URLs requested by the page, especially SWF/Flash/game files.
                        try {
                          if (window.__bleachUrlScannerStarted) return;
                          window.__bleachUrlScannerStarted = true;
                          setInterval(function() {
                            try {
                              var entries = performance.getEntriesByType("resource") || [];
                              entries.forEach(function(e) {
                                var u = e && e.name ? String(e.name) : "";
                                if (/\\.swf(?:[?#]|$)/i.test(u) ||
                                    /flash|shockwave|game/i.test(u)) {
                                  if (window.BleachDebug) window.BleachDebug.reportUrl(u);
                                }
                              });
                            } catch(e) {}
                          }, 1500);
                        } catch(e) {}

                        var s = document.createElement("script");
                        s.src = "https://unpkg.com/@ruffle-rs/ruffle@latest";
                        s.setAttribute("data-ruffle-early", early ? "1" : "0");
                        s.onload = function() {
                          startRuffle();
                          var observer = new MutationObserver(function() { startRuffle(); });
                          if (document.documentElement) {
                            observer.observe(document.documentElement, {childList:true, subtree:true});
                          }
                        };
                        s.onerror = function() { document.title = "Ruffle CDN failed"; };
                        (document.head || document.documentElement).appendChild(s);
                      })();
                  """.trimIndent()
                  web.evaluateJavascript(js, null)
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF
          sed -i 's#<string name="app_name">Ruffle</string>#<string name="app_name">Bleach Online</string>#' app/src/main/res/values/strings.xml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Install Rust target and cargo-ndk
        working-directory: ruffle
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@4.1.2 --locked

      - name: Build Ruffle native library
        working-directory: ruffle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          unset ANDROID_SDK_ROOT
          cargo ndk --target arm64-v8a --platform 26 -o jniLibs build --release --features jpegxr

      - name: Copy native library into Android app
        working-directory: ruffle
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r jniLibs/* app/src/main/jniLibs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build signed debug APK
        working-directory: ruffle
        run: ./gradlew assembleDebug -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Verify APK signature
        working-directory: ruffle
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Bleach-Online-Native-Ruffle-arm64-signed
          path: ruffle/app/build/outputs/apk/debug/*.apk
