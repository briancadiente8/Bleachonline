name: Build Bleach Online Android (Native Ruffle)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native Ruffle Android
        uses: actions/checkout@v4
        with:
          repository: ruffle-rs/ruffle-android
          path: ruffle

      - name: Replace launcher with Bleach Online browser bridge
        working-directory: ruffle
        run: |
          cat > app/src/main/java/rs/ruffle/MainActivity.kt <<'EOF'
          package rs.ruffle

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.Window
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity

          class MainActivity : ComponentActivity() {
              private lateinit var web: WebView
              private val homeUrl = "https://bleach.gogames.me/"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.databaseEnabled = true
                  web.settings.allowFileAccess = true
                  web.settings.allowContentAccess = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  web.settings.userAgentString =
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:84.0) Gecko/20100101 Firefox/84.0"

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)

                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          return handlePossibleSwf(request.url.toString())
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, url: String): Boolean {
                          return handlePossibleSwf(url)
                      }
                  }

                  web.setDownloadListener(DownloadListener { url, _, _, _, _ ->
                      handlePossibleSwf(url)
                  })

                  setContentView(web)
                  web.loadUrl(homeUrl)
              }

              private fun handlePossibleSwf(url: String): Boolean {
                  val lower = url.lowercase()
                  if (lower.substringBefore('?').substringBefore('#').endsWith(".swf") ||
                      lower.contains(".swf?") ||
                      lower.contains(".swf#")) {
                      startActivity(
                          Intent(this, PlayerActivity::class.java).apply {
                              data = Uri.parse(url)
                          }
                      )
                      return true
                  }
                  return false
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF

          sed -i 's#<string name="app_name">Ruffle</string>#<string name="app_name">Bleach Online</string>#' app/src/main/res/values/strings.xml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Install Rust target and cargo-ndk
        working-directory: ruffle
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@4.1.2 --locked

      - name: Build Ruffle native library
        working-directory: ruffle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          unset ANDROID_SDK_ROOT
          cargo ndk --target arm64-v8a --platform 26 -o jniLibs build --release --features jpegxr

      - name: Copy native library into Android app
        working-directory: ruffle
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r jniLibs/* app/src/main/jniLibs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build arm64 APK
        working-directory: ruffle
        env:
          ABI_FILTERS: arm64-v8a
        run: ./gradlew assembleRelease -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bleach-Online-Native-Ruffle-arm64
          path: ruffle/app/build/outputs/apk/release/*.apk
