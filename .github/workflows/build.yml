name: Build Bleach Online Android (Native Ruffle)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native Ruffle Android
        uses: actions/checkout@v4
        with:
          repository: ruffle-rs/ruffle-android
          path: ruffle

      - name: Replace launcher with Ruffle Flash polyfill browser
        working-directory: ruffle
        run: |
          cat > app/src/main/java/rs/ruffle/MainActivity.kt <<'EOF'
          package rs.ruffle

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.view.Window
          import android.view.WindowManager
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity

          class MainActivity : ComponentActivity() {
              private lateinit var web: WebView
              private val homeUrl = "https://bleach.gogames.me/"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestWindowFeature(Window.FEATURE_NO_TITLE)
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.databaseEnabled = true
                  web.settings.allowFileAccess = true
                  web.settings.allowContentAccess = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  web.settings.userAgentString = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:84.0) Gecko/20100101 Firefox/84.0"

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)
                  web.webChromeClient = WebChromeClient()

                  web.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(view: WebView, url: String, favicon: android.graphics.Bitmap?) {
                          injectRuffle(true)
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          injectRuffle(false)
                      }
                  }

                  setContentView(web)
                  web.loadUrl(homeUrl)
              }

              private fun injectRuffle(early: Boolean = false) {
                  val js = """
                      (function() {
                        if (early && window.__bleachRuffleEarly) return;
                        if (!early && window.__bleachRuffleBridge) return;
                        if (early) window.__bleachRuffleEarly = true;
                        else window.__bleachRuffleBridge = true;
                        window.__bleachRuffleBridge = true;

                        // Pretend the legacy Flash plugin exists so GoGames does not stop at its Flash check.
                        try {
                          const flashPlugin = {name:"Shockwave Flash", description:"Shockwave Flash 32.0 r0", filename:"pepflashplayer.dll", version:"32.0.0.465"};
                          const flashMime = {type:"application/x-shockwave-flash", suffixes:"swf", description:"Shockwave Flash"};
                          Object.defineProperty(navigator, "plugins", {get:function(){ return [flashPlugin]; }, configurable:true});
                          Object.defineProperty(navigator, "mimeTypes", {get:function(){ return [flashMime]; }, configurable:true});
                          window.ActiveXObject = window.ActiveXObject || function(){ return {GetVariable:function(){return "$version";}}; };
                        } catch(e) {}
                        
                        window.RufflePlayer = window.RufflePlayer || {};
                        window.RufflePlayer.config = {
                          autoplay: "on",
                          unmuteOverlay: "hidden",
                          warnOnUnsupportedContent: false,
                          allowNetworking: "all",
                          upgradeToHttps: false,
                          compatibilityRules: true,
                          polyfills: true,
                          favorFlash: false
                        };

                        function startRuffle() {
                          try {
                            if (window.RufflePlayer && window.RufflePlayer.newest) {
                              var api = window.RufflePlayer.newest();
                              if (api.pluginPolyfill) api.pluginPolyfill();
                              if (api.polyfill) api.polyfill();
                            }
                          } catch (e) {
                            console.log("Ruffle polyfill error", e);
                          }
                        }

                        var s = document.createElement("script");
                        s.src = "https://unpkg.com/@ruffle-rs/ruffle@latest";
                        s.setAttribute("data-ruffle-early", early ? "1" : "0");
                        s.onload = function() {
                          startRuffle();
                          var observer = new MutationObserver(function() { startRuffle(); });
                          if (document.documentElement) {
                            observer.observe(document.documentElement, {childList:true, subtree:true});
                          }
                        };
                        s.onerror = function() { document.title = "Ruffle CDN failed"; };
                        (document.head || document.documentElement).appendChild(s);
                      })();
                  """.trimIndent()
                  web.evaluateJavascript(js, null)
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF
          sed -i 's#<string name="app_name">Ruffle</string>#<string name="app_name">Bleach Online</string>#' app/src/main/res/values/strings.xml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Install Rust target and cargo-ndk
        working-directory: ruffle
        run: |
          rustup show
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@4.1.2 --locked

      - name: Build Ruffle native library
        working-directory: ruffle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          unset ANDROID_SDK_ROOT
          cargo ndk --target arm64-v8a --platform 26 -o jniLibs build --release --features jpegxr

      - name: Copy native library into Android app
        working-directory: ruffle
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r jniLibs/* app/src/main/jniLibs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build signed debug APK
        working-directory: ruffle
        run: ./gradlew assembleDebug -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Verify APK signature
        working-directory: ruffle
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Bleach-Online-Native-Ruffle-arm64-signed
          path: ruffle/app/build/outputs/apk/debug/*.apk
